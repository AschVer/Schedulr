name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve build metadata
        id: meta
        run: |
          set -euo pipefail
          # Monotonic, always-greater-than-installed versionCode so the app can
          # detect every new build as an update (current shipped build is 15).
          BUILD_NUMBER="$(date +%s)"
          VERSION_NAME="$(awk '/^version:/{print $2; exit}' pubspec.yaml | sed 's/+.*//')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: flutter build apk --debug --build-number "${{ steps.meta.outputs.build_number }}" --build-name "${{ steps.meta.outputs.version_name }}"

      - name: Stage APK and update manifest
        run: |
          set -euo pipefail
          APK="Schedulr-debug.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "$APK"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$APK")"
          cat > update.json <<EOF
          {
            "versionCode": ${{ steps.meta.outputs.build_number }},
            "versionName": "${{ steps.meta.outputs.version_name }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest-debug/$APK",
            "apkSize": $SIZE,
            "sha256": "$SHA",
            "releaseNotes": "Continuous debug build · ${{ steps.meta.outputs.short_sha }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "--- update.json ---"
          cat update.json

      - name: Publish to latest-debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="latest-debug"
          gh release create "$TAG" \
            Schedulr-debug.apk update.json \
            --title "Continuous debug build" \
            --notes "Auto-published debug APK with an in-app updater manifest." \
            --prerelease \
            || gh release upload "$TAG" Schedulr-debug.apk update.json --clobber

      - name: Test Android widget parser
        if: ${{ always() }}
        continue-on-error: true
        run: ./android/gradlew -p android :app:testDebugUnitTest --tests 'app.schedulr.schedulr.widget.*'
