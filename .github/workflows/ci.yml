name: Build release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Resolve build metadata
        id: meta
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(date +%s)"
          VERSION_NAME="$(awk '/^version:/{print $2; exit}' pubspec.yaml | sed 's/+.*//')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release --build-number "${{ steps.meta.outputs.build_number }}" --build-name "${{ steps.meta.outputs.version_name }}"

      - name: Stage APK and update manifest
        run: |
          set -euo pipefail
          APK="Schedulr-release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$APK")"
          SIGNING="release"
          if [[ -z "${ANDROID_KEYSTORE_PATH:-}" ]]; then SIGNING="debug"; fi
          cat > update.json <<EOF
          {
            "versionCode": ${{ steps.meta.outputs.build_number }},
            "versionName": "${{ steps.meta.outputs.version_name }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest/$APK",
            "apkSize": $SIZE,
            "sha256": "$SHA",
            "signing": "$SIGNING",
            "releaseNotes": "Continuous release build · ${{ steps.meta.outputs.short_sha }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "--- update.json ---"
          cat update.json

      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="latest"
          gh release create "$TAG" \
            Schedulr-release.apk update.json \
            --title "Continuous release build" \
            --notes "Auto-published release APK with an in-app updater manifest." \
            --prerelease \
            || gh release upload "$TAG" Schedulr-release.apk update.json --clobber

      - name: Test Android widget parser
        if: ${{ always() }}
        continue-on-error: true
        run: ./android/gradlew -p android :app:testDebugUnitTest --tests 'app.schedulr.schedulr.widget.*'
