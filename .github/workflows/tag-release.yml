name: Build tagged release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          set -o pipefail
          flutter test --concurrency=1 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"

      - name: Upload Flutter test log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-flutter-test-log
          path: ${{ runner.temp }}/flutter-test.log
          if-no-files-found: ignore

      - name: Test Android widget parser
        run: ./android/gradlew -p android :app:testDebugUnitTest --tests 'app.schedulr.schedulr.widget.*'

      - name: Build release APK
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Verify APK metadata and signature mode
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          if command -v apkanalyzer >/dev/null 2>&1; then
            PACKAGE_INFO="$(apkanalyzer manifest application-id "$APK")"
            VERSION_NAME="$(apkanalyzer manifest version-name "$APK")"
            VERSION_CODE="$(apkanalyzer manifest version-code "$APK")"
            [[ "$PACKAGE_INFO" == "app.schedulr.schedulr" ]]
            [[ "$VERSION_NAME" == "${GITHUB_REF_NAME#v}" || "$VERSION_NAME" == "${GITHUB_REF_NAME#v}"* ]]
            [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
            printf 'APK metadata: package=%s versionName=%s versionCode=%s\n' "$PACKAGE_INFO" "$VERSION_NAME" "$VERSION_CODE"
          fi
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            echo 'ANDROID_ARTIFACT_SIGNING=release' >> "$GITHUB_ENV"
          else
            echo 'ANDROID_ARTIFACT_SIGNING=debug' >> "$GITHUB_ENV"
          fi
          printf 'Android artifact signing mode: %s\n' "${ANDROID_ARTIFACT_SIGNING:-unknown}"

      - name: Rename APK
        run: |
          set -euo pipefail
          SAFE_TAG="${GITHUB_REF_NAME//\//-}"
          if [[ "${ANDROID_ARTIFACT_SIGNING:-debug}" == "release" ]]; then
            SUFFIX="android.apk"
          else
            SUFFIX="android-debug-signed.apk"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "Schedulr-${SAFE_TAG}-${SUFFIX}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Schedulr-*-android*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            Android release APK。配置正式 keystore 时为正式签名产物；未配置时使用 debug 签名（可直接安装，但仅建议用于测试）。
